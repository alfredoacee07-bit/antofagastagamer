<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPACE SIMULATOR</title>
  <meta name="description" content="SPACE SIMULATOR: juego educativo para diseñar, gestionar y simular una misión espacial completa.">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Fondo de estrellas (lo dibuja interfaz.js) -->
  <canvas id="estrellas" aria-hidden="true"></canvas>

  <!-- Cabecera: nombre del juego y los pasos -->
  <header class="cabecera">
    <div class="marca">
      <span class="marca-texto">SPACE <b>SIMULATOR</b></span>
    </div>
    <nav id="pasos" class="pasos" aria-label="Fases del juego"></nav>
    <div id="reloj-mision" class="reloj-mision oculto" title="Tiempo para lanzar (Misión rápida)"></div>
    <button class="btn btn-mini boton-fuentes" data-accion="fuentes" title="De dónde salen los datos">Fuentes</button>
    <button id="boton-opciones" class="btn btn-mini boton-sonido" data-accion="opciones" title="Opciones" aria-label="Opciones de música, voz y calidad"></button>
    <button id="boton-sonido" class="btn btn-mini boton-sonido" data-accion="silenciar" title="Silenciar" aria-label="Silenciar o activar el sonido"></button>
  </header>

  <!-- Panel de recursos: siempre visible durante el juego -->
  <section id="panel-recursos" class="panel-recursos" aria-label="Panel de recursos"></section>

  <!-- Aquí se dibuja la pantalla de cada fase -->
  <main id="pantalla" class="pantalla"></main>

  <!-- Botones Anterior / Siguiente -->
  <footer class="navegacion">
    <button id="btn-anterior" class="btn btn-secundario" data-accion="anterior">Anterior</button>
    <div id="aviso-nav" class="aviso-nav" aria-live="polite"></div>
    <button id="btn-siguiente" class="btn btn-principal" data-accion="siguiente">Siguiente</button>
  </footer>

  <!-- Ingeniera Paz: burbuja de ayuda -->
  <aside id="paz" class="paz oculto" aria-live="polite">
    <div class="paz-avatar" id="paz-avatar"></div>
    <div class="paz-burbuja">
      <strong id="paz-titulo"></strong>
      <p id="paz-texto"></p>
      <div class="paz-botones">
        <button class="btn btn-mini" data-accion="cerrarPaz" id="paz-ok">¡Entendido!</button>
        <button class="btn btn-mini paz-repetir" data-accion="repetirVoz" id="paz-repetir" title="Escuchar de nuevo" aria-label="Escuchar de nuevo"></button>
      </div>
    </div>
  </aside>
  <button id="paz-boton" class="paz-boton" data-accion="abrirPaz" aria-label="Pedir ayuda a la Ingeniera Paz" title="Ingeniera Paz"></button>

  <!-- Ventana emergente (para "¿Por qué?", opciones, créditos e imprevistos) -->
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-caja">
      <button class="modal-cerrar" data-accion="cerrarModal" id="modal-cerrar" aria-label="Cerrar"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <!-- El orden importa: íconos y datos primero, luego cálculos, simulación y al final la interfaz -->
  <script src="js/lib/three.min.js"></script>
  <script src="js/texturas.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/creditos.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/escenarios/chile.js"></script>
  <script src="js/escenarios/incendios.js"></script>
  <script src="js/escenarios/luna.js"></script>
  <script src="js/escenarios/marte.js"></script>
  <script src="js/escenarios/apofis.js"></script>
  <script src="js/datos/contratos.js"></script>
  <script src="js/modos.js"></script>
  <script src="js/datos/motores.js"></script>
  <script src="js/cohetes.js"></script>
  <script src="js/datos/trayectorias.js"></script>
  <script src="js/trayectorias.js"></script>
  <script src="js/datos/estrellas.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/simulacion.js"></script>
  <script src="js/minijuegos.js"></script>
  <script src="js/vista3d.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/hangar.js"></script>
  <script src="js/interfaz.js"></script>
</body>
</html>
